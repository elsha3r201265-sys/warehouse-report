<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تقرير المخزن</title>
    <style>
      :root {
        --bg: #0b1220;
        --bg-soft: #111b2d;
        --panel: #162336;
        --panel-2: #1a2b43;
        --table-head: #202d47;
        --text: #edf4ff;
        --muted: #96a7c0;
        --primary: #4f8cff;
        --primary-soft: rgba(79, 140, 255, 0.16);
        --success: #2ec27e;
        --warning: #ffb84d;
        --danger: #ff5d73;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #0d172a 100%);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 28px;
        background: rgba(11, 18, 32, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), #7d5cff);
        color: white;
        font-weight: 700;
      }
      .brand-wrap h1 { margin: 0; font-size: 1.35rem; }

      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 10px 16px;
        border-radius: 12px;
        transition: 0.2s ease;
      }
      .nav button.active,
      .nav button:hover {
        background: var(--primary-soft);
        color: var(--text);
      }

      .page-container {
        max-width: 1400px;
        margin: 24px auto 40px;
        padding: 0 20px;
      }

      .card {
        background: rgba(22, 35, 54, 0.96);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(280px, 1.7fr) minmax(180px, 0.8fr) minmax(180px, 0.5fr);
        gap: 18px;
        align-items: center;
        padding: 16px 18px;
      }

      .search-box, .filter-box, .stat-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
      }
      .search-box input, .filter-box select {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
      }
      .search-box input::placeholder { color: var(--muted); }
      .filter-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .filter-box label { color: var(--muted); font-size: 0.9rem; }
      .stat-box {
        justify-content: space-between;
        font-size: 1rem;
      }
      .stat-box span { color: var(--muted); }
      .stat-box strong {
        font-size: 1.5rem;
        color: var(--success);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }
      .mini-card {
        padding: 22px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mini-card .label { color: var(--muted); }
      .mini-card strong { font-size: 2rem; }

      .table-card {
        margin-top: 26px;
        padding: 18px 16px 10px;
      }
      .section-header {
        padding: 4px 8px 16px;
      }
      .section-header h2 { margin: 0; font-size: 1.2rem; }
      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1100px;
      }
      th, td {
        padding: 14px 12px;
        text-align: center;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        background: var(--table-head);
        color: #dfeaff;
        font-weight: 600;
      }
      tbody tr:hover { background: rgba(255,255,255,0.02); }

      .status-badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .status-normal {
        background: rgba(46, 194, 126, 0.18);
        color: var(--success);
      }
      .status-critical {
        background: rgba(255, 93, 115, 0.18);
        color: var(--danger);
      }

      .details-grid {
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(260px, 0.8fr);
        gap: 22px;
        margin-top: 22px;
      }
      .notifications {
        padding: 18px 16px;
      }
      .notice-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .notice-item {
        padding: 14px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
      }
      .notice-item strong {
        display: block;
        margin-bottom: 6px;
      }
      .notice-item.normal { border-right: 4px solid var(--warning); }
      .notice-item.critical { border-right: 4px solid var(--danger); }
      .notice-item small { color: var(--muted); }

      .hidden { display: none !important; }

      @media (max-width: 860px) {
        .toolbar { grid-template-columns: 1fr; }
        .stats-grid, .details-grid { grid-template-columns: 1fr; }
        .topbar { flex-wrap: wrap; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-icon">M</div>
        <div>
          <h1>تقرير المخزن</h1>
        </div>
      </div>

      <nav class="nav">
        <button class="active" type="button" data-page="main">الرئيسية</button>
        <button type="button" data-page="details">التفاصيل</button>
      </nav>
    </header>

    <main class="page-container">
      <section id="mainPage" class="page-panel">
        <div class="toolbar card">
          <div class="search-box">
            <span>🔎</span>
            <input id="searchInput" type="text" placeholder="بحث شامل في جميع الأعمدة..." />
          </div>

          <div class="filter-box">
            <label for="branchFilter">الفرع</label>
            <select id="branchFilter">
              <option value="all">الكل</option>
            </select>
          </div>

          <div class="stat-box">
            <span>عدد الأصناف</span>
            <strong id="itemCount">0</strong>
          </div>
        </div>

        <div class="stats-grid">
          <div class="mini-card card">
            <span class="label">إجمالي السجلات</span>
            <strong id="totalRecords">0</strong>
          </div>
          <div class="mini-card card">
            <span class="label">التحويلات اليوم</span>
            <strong id="todayTransfers">0</strong>
          </div>
          <div class="mini-card card">
            <span class="label">المتأخرات</span>
            <strong id="lateCount">0</strong>
          </div>
        </div>

        <section class="table-card card">
          <div class="section-header">
            <h2>سجل المخزن</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>مسلسل</th>
                  <th>الفرع</th>
                  <th>الكود</th>
                  <th>بيان الصنف</th>
                  <th>الكمية</th>
                  <th>تحويل من</th>
                  <th>تحويل إلى</th>
                  <th>اسم الفني</th>
                </tr>
              </thead>
              <tbody id="recordsTableBody"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="detailsPage" class="page-panel hidden">
        <div class="toolbar card">
          <div class="search-box">
            <span>🔎</span>
            <input id="detailSearchInput" type="text" placeholder="بحث شامل في جميع الأعمدة..." />
          </div>

          <div class="filter-box">
            <label for="detailBranchFilter">الفرع</label>
            <select id="detailBranchFilter">
              <option value="all">الكل</option>
            </select>
          </div>
        </div>

        <div class="details-grid">
          <div class="table-card card wide-table">
            <div class="section-header">
              <h2>سجل التفاصيل</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>مسلسل</th>
                    <th>الفرع</th>
                    <th>الكود</th>
                    <th>بيان الصنف</th>
                    <th>الكمية</th>
                    <th>تحويل من</th>
                    <th>تحويل إلى</th>
                    <th>اسم الفني</th>
                    <th>الحالة</th>
                    <th>تاريخ الاستحقاق</th>
                  </tr>
                </thead>
                <tbody id="detailTableBody"></tbody>
              </table>
            </div>
          </div>

          <aside class="notifications card">
            <div class="section-header">
              <h2>إشعارات التأخير</h2>
            </div>
            <ul id="notificationList" class="notice-list"></ul>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const records = [
        { id: 1, branch: 'الفرع الرئيسي', code: 'WH-1001', item: 'أسلاك كهربائية', qty: 120, from: 'مستودع السيارات', to: 'ورش صيانة', technician: 'أحمد علي', date: '2026-09-21', status: 'عادي' },
        { id: 2, branch: 'فرع الرياض', code: 'WH-1055', item: 'مواد عزل', qty: 85, from: 'المخزن المركزي', to: 'فرع الرياض', technician: 'سعد محمد', date: '2026-10-02', status: 'حرج' },
        { id: 3, branch: 'فرع جدة', code: 'WH-1108', item: 'أدوات تشحيم', qty: 52, from: 'مستودع المواد', to: 'خط الإنتاج', technician: 'خالد ناصر', date: '2026-09-26', status: 'عادي' },
        { id: 4, branch: 'الفرع الرئيسي', code: 'WH-1121', item: 'أنابيب PVC', qty: 220, from: 'مستودع التجهيز', to: 'موقع التنفيذ', technician: 'فهد سالم', date: '2026-10-05', status: 'حرج' },
        { id: 5, branch: 'فرع الدمام', code: 'WH-1142', item: 'بطاريات', qty: 48, from: 'المخزن المركزي', to: 'فرع الدمام', technician: 'عبدالله رشيد', date: '2026-09-18', status: 'عادي' },
        { id: 6, branch: 'فرع جدة', code: 'WH-1166', item: 'مفاتيح وأدوات', qty: 72, from: 'مستودع الأدوات', to: 'مركز الخدمة', technician: 'إبراهيم زيد', date: '2026-10-10', status: 'حرج' },
        { id: 7, branch: 'فرع الرياض', code: 'WH-1190', item: 'إطارات', qty: 36, from: 'مستودع الحركة', to: 'الورش', technician: 'مروان طارق', date: '2026-09-08', status: 'عادي' },
        { id: 8, branch: 'الفرع الرئيسي', code: 'WH-1202', item: 'مستلزمات تنظيف', qty: 98, from: 'المخزن المركزي', to: 'العمليات', technician: 'ناصر مهدي', date: '2026-10-11', status: 'عادي' }
      ];

      const branches = [...new Set(records.map(r => r.branch))];

      function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('ar-SA', { year: 'numeric', month: '2-digit', day: '2-digit' });
      }

      function renderBranchFilter(selectorId) {
        const select = document.getElementById(selectorId);
        if (!select) return;
        select.innerHTML = '<option value="all">الكل</option>';
        branches.forEach(branch => {
          const option = document.createElement('option');
          option.value = branch;
          option.textContent = branch;
          select.appendChild(option);
        });
      }

      function filterRecords(searchText, branchName) {
        return records.filter(record => {
          const matchesBranch = branchName === 'all' || record.branch === branchName;
          const text = [
            record.branch, record.code, record.item, record.qty, record.from, record.to,
            record.technician, record.status
          ].join(' ').toLowerCase();
          const matchesSearch = text.includes(searchText.toLowerCase());
          return matchesBranch && matchesSearch;
        });
      }

      function updateSummary(filteredRecords) {
        const itemCount = filteredRecords.length;
        const totalQty = filteredRecords.reduce((sum, item) => sum + Number(item.qty), 0);
        const todayTransfers = filteredRecords.filter(item => item.date === '2026-10-11').length;
        const lateCount = filteredRecords.filter(item => item.status === 'حرج').length;

        const itemCountEl = document.getElementById('itemCount');
        const totalRecordsEl = document.getElementById('totalRecords');
        const todayTransfersEl = document.getElementById('todayTransfers');
        const lateCountEl = document.getElementById('lateCount');

        if (itemCountEl) itemCountEl.textContent = itemCount;
        if (totalRecordsEl) totalRecordsEl.textContent = totalQty;
        if (todayTransfersEl) todayTransfersEl.textContent = todayTransfers;
        if (lateCountEl) lateCountEl.textContent = lateCount;
      }

      function renderMainTable(filteredRecords) {
        const tableBody = document.getElementById('recordsTableBody');
        if (!tableBody) return;
        tableBody.innerHTML = filteredRecords.map(record => `
          <tr>
            <td>${record.id}</td>
            <td>${record.branch}</td>
            <td>${record.code}</td>
            <td>${record.item}</td>
            <td>${record.qty}</td>
            <td>${record.from}</td>
            <td>${record.to}</td>
            <td>${record.technician}</td>
          </tr>
        `).join('');
      }

      function renderDetailsTable(filteredRecords) {
        const tableBody = document.getElementById('detailTableBody');
        if (!tableBody) return;
        tableBody.innerHTML = filteredRecords.map(record => `
          <tr>
            <td>${record.id}</td>
            <td>${record.branch}</td>
            <td>${record.code}</td>
            <td>${record.item}</td>
            <td>${record.qty}</td>
            <td>${record.from}</td>
            <td>${record.to}</td>
            <td>${record.technician}</td>
            <td>
              <span class="status-badge ${record.status === 'حرج' ? 'status-critical' : 'status-normal'}">${record.status}</span>
            </td>
            <td>${formatDate(record.date)}</td>
          </tr>
        `).join('');
      }

      function renderNotifications(filteredRecords) {
        const list = document.getElementById('notificationList');
        if (!list) return;
        list.innerHTML = filteredRecords.map(record => `
          <li class="notice-item ${record.status === 'حرج' ? 'critical' : 'normal'}">
            <strong>${record.item}</strong>
            <div>${record.branch} • ${record.technician}</div>
            <small>${record.status === 'حرج' ? 'حالة حرجة' : 'حالة عادية'} • ${formatDate(record.date)}</small>
          </li>
        `).join('');
      }

      function initMainPage() {
        renderBranchFilter('branchFilter');
        const searchInput = document.getElementById('searchInput');
        const branchFilter = document.getElementById('branchFilter');

        function refresh() {
          const filtered = filterRecords(searchInput.value, branchFilter.value);
          renderMainTable(filtered);
          updateSummary(filtered);
        }

        searchInput.addEventListener('input', refresh);
        branchFilter.addEventListener('change', refresh);
        refresh();
      }

      function initDetailsPage() {
        renderBranchFilter('detailBranchFilter');
        const searchInput = document.getElementById('detailSearchInput');
        const branchFilter = document.getElementById('detailBranchFilter');

        function refresh() {
          const filtered = filterRecords(searchInput.value, branchFilter.value);
          renderDetailsTable(filtered);
          renderNotifications(filtered);
        }

        searchInput.addEventListener('input', refresh);
        branchFilter.addEventListener('change', refresh);
        refresh();
      }

      function switchPage(pageName) {
        const mainPage = document.getElementById('mainPage');
        const detailsPage = document.getElementById('detailsPage');
        const buttons = document.querySelectorAll('.nav button');

        const showMain = pageName === 'main';
        mainPage.classList.toggle('hidden', !showMain);
        detailsPage.classList.toggle('hidden', showMain);

        buttons.forEach(button => {
          button.classList.toggle('active', button.dataset.page === pageName);
        });
      }

      document.querySelectorAll('.nav button').forEach(button => {
        button.addEventListener('click', () => switchPage(button.dataset.page));
      });

      initMainPage();
      initDetailsPage();
    </script>
  </body>
</html>
